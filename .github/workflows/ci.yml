name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff pytest
      - name: Syntax check
        run: python -m compileall -q __init__.py main_dialog.py polyline.py
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
